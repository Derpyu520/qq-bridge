name: PR base guard

# 分支模型（CONTRIBUTING.md §5）：main = 发布线，只在发布时从 dev 合并；
# dev = 日常开发线，外面提的 PR 一律以 dev 为目标分支。
# GitHub 自己不阻止别人把 PR 提到 main，所以这里自动改指 dev。
#
# 两个容易踩的点：
#   1. pull_request_target 用的是**目标分支**上的工作流文件 —— 所以这个文件必须先
#      进 main 才会生效（发布合并时带过去）。
#   2. pull_request_target 带写权限，因此**绝不 checkout PR 的代码**，只用 API 改 PR 元数据。
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-base-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retarget:
    # 只处理目标为 main 的 PR；从本仓库 dev 发起的发布 PR（dev → main）必须放行，
    # 否则发布流程会被自己改指掉。
    if: github.event.pull_request.base.ref == 'main' && !(github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: 把 PR 目标分支改指 dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --base dev
